# =============================================================
#  ビズリーチ自動スカウト（GitHub Actions 実行）
#  - 手動実行(workflow_dispatch)と定期実行(schedule)に対応
#  - 既定は DRY_RUN（実送信しない）。本番は dry_run=false を明示
#  - 状態(DB・セッション)は actions/cache で実行間に保持
#  詳細は docs/GitHub Actionsで運用.md を参照
# =============================================================
name: scout

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "実送信しない(true)/本番送信(false)"
        type: choice
        options: ["true", "false"]
        default: "true"
      search_url:
        description: "ビズリーチ保存検索の結果URL（複数可: 半角スペースか | で区切る。空なら再送のみ）"
        type: string
        default: ""
      max:
        description: "1回の最大処理件数"
        type: string
        default: "30"
      mode:
        description: "実行モード（scout / pickup / analytics=Sheets同期のみ / sync-replies=返信検知のみ / restore-db=過去実行のartifactからDB復旧 / probe-replies=返信API偵察 / ほかprobe系）"
        type: choice
        options: ["scout", "pickup", "analytics", "sync-replies", "restore-db",
                  "probe-replies", "test-pickup-send", "probe-send", "test-send",
                  "probe-pickup"]
        default: "scout"
      restore_run_id:
        description: "mode=restore-db のとき必須: 復旧元の実行の run ID（その実行の artifact 内 data/bizscout.db を取り込む）"
        type: string
        default: ""
  schedule:
    # 【設計】送信は JST 11時台に着地させる（運用者指定）。
    #
    # GitHub の schedule は「指定時刻に起動する」保証がない。実測（2026-09-09〜14）で
    # 3時間25分〜6時間48分の遅延が毎日発生し、9/14 は2本のうち1本が丸ごとドロップした。
    # 結果、16:09 JST 指定の実行が 22:57 JST に着地していた。
    # 単純に時刻を前倒ししても、GitHub 側の混雑が解消した日に早朝へ着地してしまう。
    #
    # そこで「時刻を狙う」のをやめ、**1時間おきに起動し、最初に11時台以降へ着地した
    # 実行だけが送信する**設計にした（判定は gate ジョブ）。遅延0〜7時間のどれでも
    # 11時台〜以降の最初の1回で送信でき、残りは数秒で終了する。
    # 当日2回目以降の送信は gate のマーカーで抑止するため、通数は1日1回分のまま。
    #
    # 毎時00分は最も混雑するため :07 に置く。UTC 19:07〜翌02:07（JST 04:07〜11:07）。
    - cron: "7 19 * * *"  # JST 04:07（遅延7時間で11時台に着地）
    - cron: "7 20 * * *"  # JST 05:07（遅延6時間）
    - cron: "7 21 * * *"  # JST 06:07（遅延5時間）
    - cron: "7 22 * * *"  # JST 07:07（遅延4時間）
    - cron: "7 23 * * *"  # JST 08:07（遅延3時間）
    - cron: "7 0 * * *"   # JST 09:07（遅延2時間）
    - cron: "7 1 * * *"   # JST 10:07（遅延1時間）
    - cron: "7 2 * * *"   # JST 11:07（遅延なし）

# 同時実行を禁止して二重送信を防ぐ（キューイング）。
concurrency:
  group: bizscout-scout
  cancel-in-progress: false

permissions:
  contents: read
  # mode=restore-db が過去実行の artifact（DBスナップショット）を取得するために必要。
  actions: read

jobs:
  # 本日の送信枠かどうかだけを判定する軽量ジョブ（数秒で終わる）。
  # Python/Chromium の準備前に落とすため、本体とは別ジョブにしている。
  # 判定はJSTで行い、次のすべてを満たすときだけ本体を動かす:
  #   1. 送信開始時刻（既定 11時 JST）以降である
  #   2. 締切時刻（既定 19時 JST）より前である（深夜に届くのを防ぐ）
  #   3. 本日まだ送信していない（当日マーカーのキャッシュが無い）
  # 手動実行(workflow_dispatch)は明示操作なので、この判定を行わず常に実行する。
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      jst_date: ${{ steps.now.outputs.jst_date }}
      reason: ${{ steps.decide.outputs.reason }}
      deadline_passed: ${{ steps.decide.outputs.deadline_passed }}
    steps:
      - name: 現在のJST日時
        id: now
        run: |
          {
            echo "jst_date=$(TZ=Asia/Tokyo date +%Y-%m-%d)"
            echo "jst_hour=$(TZ=Asia/Tokyo date +%-H)"
            echo "jst_time=$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M %a')"
          } >> "$GITHUB_OUTPUT"

      # 当日マーカー。本体が送信を始めた時点で保存され、同じ日の後続の起動を止める。
      # lookup-only なので実体のダウンロードは行わない（存在確認のみ）。
      - name: 本日の送信済みマーカーを確認
        id: marker
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .bizscout-daily
          key: bizscout-daily-${{ steps.now.outputs.jst_date }}
          lookup-only: true

      - name: 送信枠かを判定
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          JST_HOUR: ${{ steps.now.outputs.jst_hour }}
          JST_TIME: ${{ steps.now.outputs.jst_time }}
          ALREADY: ${{ steps.marker.outputs.cache-hit }}
          # 送信を開始する時刻（JSTの時）。既定は運用者指定の11時。
          START_HOUR: ${{ vars.BIZSCOUT_SEND_HOUR_JST || '11' }}
          # この時刻を過ぎたら本日は見送る（深夜に届かせないための締切）。
          DEADLINE_HOUR: ${{ vars.BIZSCOUT_SEND_DEADLINE_HOUR_JST || '19' }}
        run: |
          set -euo pipefail
          # $3 は「締切超過で見送った」フラグ。後段の警告ステップの条件に使う
          # （式側で数値比較をせずに済むよう、判定結果をそのまま渡す）。
          decide() {
            {
              echo "should_run=$1"
              echo "reason=$2"
              echo "deadline_passed=${3:-false}"
            } >> "$GITHUB_OUTPUT"
            echo "$2"
          }
          if [ "$EVENT" != "schedule" ]; then
            decide true "手動実行のため、送信枠の判定をせずに実行します（現在 $JST_TIME JST）。"
          elif [ "$ALREADY" = "true" ]; then
            decide false "本日はすでに送信済みのため、この起動はスキップします（現在 $JST_TIME JST）。"
          elif [ "$JST_HOUR" -lt "$START_HOUR" ]; then
            decide false "送信開始時刻（${START_HOUR}時 JST）前のためスキップします（現在 $JST_TIME JST）。GitHubの遅延が小さい日は、後続の起動が${START_HOUR}時台に着地します。"
          elif [ "$JST_HOUR" -ge "$DEADLINE_HOUR" ]; then
            decide false "締切（${DEADLINE_HOUR}時 JST）を過ぎたため、本日は見送ります（現在 $JST_TIME JST）。GitHubの定期実行が終日大幅に遅延した可能性があります。" true
          else
            decide true "送信枠内のため実行します（現在 $JST_TIME JST / 開始${START_HOUR}時・締切${DEADLINE_HOUR}時）。"
          fi

      # 終日スキップのまま終わった日を見落とさないよう、締切超過だけは警告として残す。
      - name: 締切超過の警告
        if: steps.decide.outputs.deadline_passed == 'true'
        run: |
          echo "::warning::${{ steps.decide.outputs.reason }}"
          echo "## ⚠️ 本日は送信を見送りました" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  scout:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # 注意: 送信が多い日は「送信間隔(20-60秒)×件数＋受信箱スキャン(約7分)」で30分を
    # 超えることがある。30分設定だった2026-07に3回タイムアウトでキャンセルされ、
    # 送信後のキャッシュ保存が走らず計44件の送信記録が消失した（送信自体は完了済み）。
    # 1日1回・20通運用では 2026-09-14 の実測（12通で28分・1通あたり約94秒）から
    # 20通で約45分、ピックアップが多い日はさらに伸びる。再びタイムアウトで
    # 送信記録を失わないよう、実測の2倍の余裕を取る。
    timeout-minutes: 90
    env:
      # 全タイムスタンプ（送信記録・週次集計）をJSTで統一する。
      TZ: "Asia/Tokyo"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BIZREACH_EMAIL: ${{ secrets.BIZREACH_EMAIL }}
      BIZREACH_PASSWORD: ${{ secrets.BIZREACH_PASSWORD }}
      BIZSCOUT_MODEL: ${{ vars.BIZSCOUT_MODEL || 'claude-opus-5' }}
      # 1日1回の実行に集約したため、この値がそのまま「1日の送信上限」になる。
      # 従来は1日2回×10通=20通だったので、通数を維持するため 20 を既定にしている。
      # 変更は repo variable BIZSCOUT_MAX_SENDS_PER_DAY で行う。
      # 注意: 旧 variable BIZSCOUT_MAX_SENDS_PER_RUN はもう参照しない（1回=1日になり
      # 名前が実態と合わないため）。設定済みなら削除してよい。
      BIZSCOUT_MAX_SENDS_PER_RUN: ${{ vars.BIZSCOUT_MAX_SENDS_PER_DAY || '20' }}
      # 状態DB消失ガード。送信履歴が空のまま実送信しようとしたら中断する
      # （actions/cache 失効で重複防止データが消え、全候補者へ再送信する事故を防ぐ）。
      # 既定を true にしているのは、本番が既に多数の送信実績を持つため。
      # 本当の初回運用のときだけ Variables に false を設定する。
      BIZSCOUT_EXPECT_STATE: ${{ vars.BIZSCOUT_EXPECT_STATE || 'true' }}
      BIZSCOUT_GSHEET_SPREADSHEET_ID: ${{ vars.BIZSCOUT_GSHEET_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # --- 実行間で状態(DB・ログイン セッション)を保持 ---
      # 注意: actions/cache は最善努力。長期間未実行や容量超過で消えると
      #       重複判定/再送スケジュールがリセットされる（重複送信リスク）。
      # restore のみ行い、保存は明示ステップで送信直後＋実行末尾に行う（下記参照）。
      # 旧来の actions/cache（実行末尾のpostステップでのみ保存）では、送信後に
      # タイムアウト等でキャンセルされると保存されず、送信記録が丸ごと巻き戻る
      # （2026-07に4回発生・計56件消失）。restore-keys の前方一致は「最新の保存」を選ぶ。
      - name: Restore state (data/)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: bizscout-data-${{ github.run_id }}
          restore-keys: |
            bizscout-data-

      # --- 設定の解決（手動入力 or repo variables）---
      # 検索URLは複数指定可（改行・半角スペース・パイプ | 区切り。カンマは不可）。
      # 複数行の値も壊れないよう env: 経由＋heredocで安全に渡す。
      - name: Resolve run config
        env:
          IN_SEARCH_URL: ${{ inputs.search_url }}
          VAR_SEARCH_URL: ${{ vars.BIZSCOUT_SEARCH_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BIZSCOUT_DRY_RUN=${{ inputs.dry_run }}" >> "$GITHUB_ENV"
            echo "RUN_MAX=${{ inputs.max }}" >> "$GITHUB_ENV"
            echo "RUN_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            SEARCH_URL_VAL="$IN_SEARCH_URL"
          else
            echo "BIZSCOUT_DRY_RUN=${{ vars.BIZSCOUT_DRY_RUN || 'true' }}" >> "$GITHUB_ENV"
            # 保存検索1件あたりの取り込み上限。送信上限(20通)に届かせるだけの母数が要る。
            # 実測の通過率は約45%（2026-09-14: 22件取り込み→10件送信）なので、
            # 保存検索4件×15 = 60件 ≒ 27件送信ぶんの母数を確保する。
            # 変更は repo variable BIZSCOUT_INGEST_PER_SEARCH で行う（旧 BIZSCOUT_MAX は
            # 1日2回運用時の値(10)のままで送信上限に届かないため参照しない）。
            echo "RUN_MAX=${{ vars.BIZSCOUT_INGEST_PER_SEARCH || '15' }}" >> "$GITHUB_ENV"
            echo "RUN_MODE=scout" >> "$GITHUB_ENV"
            SEARCH_URL_VAL="$VAR_SEARCH_URL"
          fi
          # 複数行対応で SEARCH_URL を渡す（1URL/行でもスペース/パイプ区切りでもOK）。
          {
            echo "SEARCH_URL<<__BIZSCOUT_EOF__"
            echo "$SEARCH_URL_VAL"
            echo "__BIZSCOUT_EOF__"
          } >> "$GITHUB_ENV"
          # 運用ルール: 金土日・祝日・祝日前日(JST)の定期実行はピックアップ
          # （無料枠・毎日送信）のみとし、
          # 通常スカウト（検索スカウト＋再送）はスキップする。判定は config/scout_rules.yaml の
          # schedule セクションに基づき bizscout check-schedule が行う（祝日は振替休日・
          # 国民の休日も判定）。手動実行(workflow_dispatch)は明示操作なので対象外。
          SCHED_OUT="$(bizscout check-schedule --kind search 2>&1 || true)"
          echo "$SCHED_OUT"
          # 判定が SKIP: を返したときだけ休止する。判定自体が失敗した場合は SKIP: が
          # 出ないため従来どおり送信する（設定エラーで業務が止まらないようにする）。
          if [ "${{ github.event_name }}" = "schedule" ] && printf '%s' "$SCHED_OUT" | grep -q '^SKIP:'; then
            echo "SKIP_SEARCH=true" >> "$GITHUB_ENV"
            echo "本日は通常スカウトを休止し、ピックアップのみ送付します。"
          else
            echo "SKIP_SEARCH=false" >> "$GITHUB_ENV"
          fi

      # --- ログイン セッションを secret から復元（2FA/bot検知回避に推奨）---
      - name: Seed Bizreach session
        env:
          STATE_B64: ${{ secrets.BIZREACH_STORAGE_STATE_B64 }}
        run: |
          if [ -n "$STATE_B64" ]; then
            mkdir -p data/sessions
            echo "$STATE_B64" | base64 -d > data/sessions/bizreach_state.json
            echo "保存済みセッションを復元しました。"
          else
            echo "セッション secret 未設定。cache のセッション、または email/password ログインに依存します。"
          fi

      # --- DB復旧（mode=restore-db）---
      # 過去実行の artifact（bizscout-logs-<run_id> 内の data/bizscout.db）を取得し、
      # 欠けている記録だけを現行DBへ取り込む（現行の記録は上書きしない・冪等）。
      # キャッシュ消失で巻き戻った送信・返信・件名・プロフィールを丸ごと戻せる。
      # 例: 2026-08-19 の巻き戻りは run 32124592882（8/18 実行）から復旧する。
      - name: Download DB snapshot (mode=restore-db)
        if: env.RUN_MODE == 'restore-db'
        uses: actions/download-artifact@v4
        with:
          name: bizscout-logs-${{ inputs.restore_run_id }}
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
          path: restore_tmp

      - name: Merge DB snapshot (mode=restore-db)
        if: env.RUN_MODE == 'restore-db'
        run: |
          if [ -z "${{ inputs.restore_run_id }}" ]; then
            echo "::error::restore_run_id が未指定です。復旧元の run ID を指定してください。"
            exit 1
          fi
          SNAP="$(find restore_tmp -name 'bizscout.db' | head -1)"
          if [ -z "$SNAP" ]; then
            echo "::error::artifact に data/bizscout.db が見つかりません。"
            exit 1
          fi
          echo "復旧元スナップショット: $SNAP"
          bizscout merge-db --from "$SNAP"

      # 送信記録の自己修復。actions/cache が消えていても、実行ログ由来の復元表
      # （config/sent_backfill.json）から送信履歴（重複送信防止・分析の分母）を
      # 再構築する。doctor の送信履歴チェックより前に行う（復元しても空のままの
      # 時だけ doctor が fail して実行を止める）。
      - name: Restore send history (self-heal)
        run: bizscout restore-state

      # 起動前チェックは送信のゲートにする。fail（APIキー未設定・設定のタイポ・
      # 認証情報欠落・DB書き込み不可・playwright未導入・送信履歴の消失など）が
      # 1件でもあれば後続の送信ステップを実行しない。warn は許容される。
      # 以前は continue-on-error: true で「点検が失敗しても送信が続く」状態だった。
      - name: Preflight (doctor)
        run: bizscout doctor

      # 状態の保存は doctor 通過後にだけ許可する。キャッシュ消失などで点検に失敗した
      # 実行が空の data/ を「最新の保存」としてキャッシュへ書き込み、正常なキャッシュを
      # 覆い隠す事故を防ぐ（2026-08-17 に発生。復元表に無い送信記録がシートから消えた）。
      - name: Allow state saves
        run: echo "STATE_OK=true" >> "$GITHUB_ENV"

      # 本日の送信枠を使い切ったことを記録する（gate ジョブがこれを見て後続の起動を止める）。
      # 定期実行は dry-run でも記録する（1日1回に保つため）。手動実行は実送信のときだけ
      # 記録し、dry-run の試し実行がその日の枠を潰さないようにする。
      # 送信を**始める前**に置くのが要点:
      #   - これより前（準備・点検）で落ちた実行は準備の失敗なので、後続の起動に再挑戦させる
      #   - これより後で落ちた実行は送信が進んでいる可能性があるため、再挑戦させない
      #     （後続が新しい候補者へもう1バッチ送ってしまい、1日の通数が倍になるのを防ぐ）
      - name: Mark today's send slot as used
        if: >-
          github.event_name == 'schedule'
          || (env.BIZSCOUT_DRY_RUN == 'false'
              && (env.RUN_MODE == 'scout' || env.RUN_MODE == 'pickup'))
        run: |
          mkdir -p .bizscout-daily
          echo "run_id=${{ github.run_id }} at $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M %Z')" \
            > .bizscout-daily/done
          cat .bizscout-daily/done

      - name: Save today's send marker
        if: >-
          github.event_name == 'schedule'
          || (env.BIZSCOUT_DRY_RUN == 'false'
              && (env.RUN_MODE == 'scout' || env.RUN_MODE == 'pickup'))
        continue-on-error: true   # 同日に既にマーカーがあるときの保存失敗で実行を止めない
        uses: actions/cache/save@v4
        with:
          path: .bizscout-daily
          key: bizscout-daily-${{ needs.gate.outputs.jst_date }}

      # 本日のピックアップ（無料枠・本命）。求人ベース＋候補者ベースの両セクションを処理。
      # 本命なので先に実行し、失敗しても検索スカウトは続行させる（continue-on-error）。
      - name: Run pickup (本日のピックアップ・無料枠・本命)
        id: pickup
        if: env.RUN_MODE == 'pickup' || github.event_name == 'schedule'
        continue-on-error: true
        env:
          # ピックアップは「本日の全対象を必ず開封（既読化）する」ため、検索スカウトの
          # RUN_MAX とは別の余裕ある上限を使う。実際に RUN_MAX=10 で 12件中2件
          # （本命のピックアップ求人2名）が未開封のまま残った事故の再発防止。
          # 送信は無料枠（プラチナ残数を消費しない）のため、検索スカウトの送信上限
          # BIZSCOUT_MAX_SENDS_PER_RUN とも切り分け、対象条件を満たす全員へ送信する。
          PICKUP_MAX: ${{ vars.BIZSCOUT_PICKUP_MAX || '50' }}
        run: |
          echo "本日のピックアップ（求人＋候補者）へ送信します（DRY_RUN=$BIZSCOUT_DRY_RUN / MAX=$PICKUP_MAX）。"
          bizscout run-pickup --kind both --max "$PICKUP_MAX"

      # 【重要】送信直後に状態を保存する。後段（検索スカウト・返信検知・分析）で
      # タイムアウトやキャンセルが起きても、ここまでの送信記録は失われない。
      - name: Save state after pickup (data/)
        if: always() && env.STATE_OK == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: bizscout-data-${{ github.run_id }}-pickup

      # ピックアップは continue-on-error のため job 全体は緑のまま進むが、
      # 認証切れ等の全滅（exit 非0）は job summary に明示して見落としを防ぐ。
      - name: Flag pickup failure
        if: steps.pickup.outcome == 'failure'
        run: |
          echo "::warning::本日のピックアップ送信が失敗しました（exit 非0）。ログを確認してください。"
          echo "⚠️ 本日のピックアップ送信が失敗しました（認証切れ・全件失敗の可能性）。" >> "$GITHUB_STEP_SUMMARY"

      # 検索スカウト（プラチナ枠）＋再送。schedule と mode=scout で実行。
      # ただし金土日・祝日・祝日前日(JST)の定期実行は SKIP_SEARCH=true でスキップ
      # （ピックアップのみ運用）。
      - name: Run scout (検索スカウト＋再送)
        if: (env.RUN_MODE == 'scout' || github.event_name == 'schedule') && env.SKIP_SEARCH != 'true'
        run: |
          # 保存検索を何件読み込んだかをログとサマリに出す（「1つ目しか読まれていない
          # のでは」という疑いをログだけで判定できるようにする）。
          URL_COUNT="$(printf '%s' "$SEARCH_URL" | tr '|' '\n' | tr ' ' '\n' | grep -c '^http' || true)"
          echo "DRY_RUN=$BIZSCOUT_DRY_RUN / 取り込み上限=$RUN_MAX（保存検索1件あたり）/ 保存検索=${URL_COUNT}件 / 送信上限=${BIZSCOUT_MAX_SENDS_PER_RUN}件（全保存検索の合計）"
          echo "検索スカウト: 保存検索 ${URL_COUNT} 件 / 送信は合計 ${BIZSCOUT_MAX_SENDS_PER_RUN} 件まで" \
            >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SEARCH_URL" ]; then
            bizscout serve --once --max "$RUN_MAX" --search-url "$SEARCH_URL"
          else
            bizscout serve --once --max "$RUN_MAX"
          fi

      # 【重要】検索スカウト＋再送の直後にも状態を保存（送信記録の消失防止）。
      - name: Save state after scout (data/)
        if: always() && env.STATE_OK == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: bizscout-data-${{ github.run_id }}-scout

      # 送信フロー偵察モード（実送信なし）。送信API/セレクタ特定用の情報を artifact に残す。
      - name: Probe send flow (実送信なし)
        if: env.RUN_MODE == 'probe-send'
        run: |
          echo "送信フロー偵察を実行します（実送信はしません）。"
          if [ -n "$SEARCH_URL" ]; then
            bizscout probe-send --search-url "$SEARCH_URL"
          else
            echo "SEARCH_URL が未設定です。search_url を指定して再実行してください。"
            exit 1
          fi

      # 送信API検証モード（dryRun=True・実送信なし）。payload/権限の確認用。
      - name: Test send (dryRun・実送信なし)
        if: env.RUN_MODE == 'test-send'
        run: |
          echo "送信APIを dryRun=True で検証します（実送信はしません）。"
          if [ -n "$SEARCH_URL" ]; then
            bizscout test-send --search-url "$SEARCH_URL"
          else
            echo "SEARCH_URL が未設定です。search_url を指定して再実行してください。"
            exit 1
          fi

      # 本日のピックアップ候補者リストAPIの偵察（実送信なし）。
      - name: Probe pickup (実送信なし)
        if: env.RUN_MODE == 'probe-pickup'
        run: bizscout probe-pickup

      # ピックアップ送信API(/v2/scouts/pickup)の dryRun 検証（対象条件を無視・実送信なし）。
      - name: Test pickup send (dryRun・実送信なし)
        if: env.RUN_MODE == 'test-pickup-send'
        run: |
          echo "ピックアップ送信APIを dryRun=True で検証します（実送信なし・残数消費なし）。"
          bizscout test-pickup-send --kind job

      # 返信データの偵察（実送信なし）。メッセージ系画面のAPI応答を artifact に残す。
      - name: Probe replies (返信API偵察・実送信なし)
        if: env.RUN_MODE == 'probe-replies'
        run: bizscout probe-replies

      # --- スカウト分析 -------------------------------------------------------
      # 返信の自動検知（送信済み・未返信のレジュメを再取得してシグナル確認）。
      - name: Sync replies (返信自動検知)
        if: >-
          (github.event_name == 'schedule' || env.RUN_MODE == 'scout'
           || env.RUN_MODE == 'sync-replies')
        continue-on-error: true
        run: bizscout sync-replies

      # Google サービスアカウント鍵を secret から復元（キャッシュ/artifact に載る
      # data/ 配下には置かない）。secret には base64 でも「鍵JSONそのまま」でもよい。
      # この工程の失敗で送信ジョブを赤にしない（警告してスキップ）。
      - name: Seed Google service account
        if: always()
        continue-on-error: true
        env:
          GSA_B64: ${{ secrets.GSHEET_SERVICE_ACCOUNT_B64 }}
        run: |
          if [ -z "$GSA_B64" ]; then
            echo "GSHEET_SERVICE_ACCOUNT_B64 未設定。Sheets 同期はスキップされます。"
            exit 0
          fi
          out="$RUNNER_TEMP/gsa.json"
          if [ "${GSA_B64#\{}" != "$GSA_B64" ]; then
            # '{' で始まる = 鍵JSONがそのまま貼られている（base64不要の簡単ルート）。
            printf '%s' "$GSA_B64" > "$out"
          else
            # base64。コピー時に混入しがちな空白・改行を除去してから復号する。
            if ! printf '%s' "$GSA_B64" | tr -d ' \n\r\t' | base64 -d > "$out" 2>/dev/null; then
              echo "::warning::GSHEET_SERVICE_ACCOUNT_B64 を復号できませんでした。鍵JSONの中身をそのまま Secret に貼り直すのが確実です（docs/スカウト分析.md）。"
              exit 0
            fi
          fi
          if python3 -c "import json;d=json.load(open('$out'));assert d.get('client_email');print('鍵を復元:', d['client_email'])"; then
            echo "BIZSCOUT_GSHEET_CREDENTIALS=$out" >> "$GITHUB_ENV"
          else
            echo "::warning::鍵JSONの形式が不正です（client_email が見つかりません）。ダウンロードした鍵JSONの中身を全文コピーして Secret に貼り直してください。"
          fi

      # 送信・返信データを Google スプレッドシートへ同期（設定済みの場合のみ）。
      # STATE_OK 条件: doctor が fail した実行（＝状態が壊れている疑い）から
      # シートを書き換えない（巻き戻った数値での上書きを防ぐ）。
      - name: Sync analytics to Google Sheets
        if: always() && env.STATE_OK == 'true'
        continue-on-error: true
        run: |
          if [ -n "$BIZSCOUT_GSHEET_CREDENTIALS" ] && [ -n "$BIZSCOUT_GSHEET_SPREADSHEET_ID" ]; then
            # 記録数が減る書き換えは中止される（状態DBの巻き戻りからシートを守る）。
            # 失敗時は job summary に出し、見落とさないようにする。
            # pipefail が無いとパイプの終了ステータスは tee のものになり、
            # bizscout の失敗を取りこぼす（2026-08-24 の Sheets 503 が無警告で
            # 素通りした原因）。
            set -o pipefail
            if ! bizscout analytics sync 2>&1 | tee sync_out.txt; then
              if grep -q "分析同期を中止しました" sync_out.txt; then
                echo "::error::分析同期を中止しました（シートの記録数が減る書き換えを検出）。"
                {
                  echo "## ⚠️ 分析同期を中止しました"
                  echo "シートの送信記録より DB の件数が少ないため、上書きを止めました。"
                  echo "状態DBが巻き戻った可能性があります。"
                  echo "**復旧**: scout ワークフローを \`mode=restore-db\` ＋"
                  echo "\`restore_run_id\`=消失前の実行ID で手動実行してください。"
                } >> "$GITHUB_STEP_SUMMARY"
              else
                # 一時障害（Google の 5xx/429 等）。次回の実行で再同期される。
                echo "::warning::分析同期に失敗しました。シートは前回の内容のままです。"
                {
                  echo "## ⚠️ 分析同期に失敗しました"
                  echo "シートは前回の内容のまま据え置かれています（送信記録は失われていません）。"
                  echo "一時的な失敗であれば次回の実行で自動的に再同期されます。"
                  echo '```'
                  tail -5 sync_out.txt
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 1
            fi
          else
            echo "Google Sheets 未設定のため分析同期をスキップします（docs/スカウト分析.md 参照）。"
          fi

      - name: Status report
        if: always()
        run: bizscout report || true

      # 実行末尾の保存（返信チェック時刻・分析メタ等を含む最終状態）。
      # restore-keys は最新の保存を選ぶため、このキーが最優先で復元される。
      - name: Save state (data/)
        if: always() && env.STATE_OK == 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: bizscout-data-${{ github.run_id }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bizscout-logs-${{ github.run_id }}
          path: |
            logs/
            data/exports/
            data/bizscout.db
          if-no-files-found: ignore
          retention-days: 14
